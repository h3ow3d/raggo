apiVersion: v1
kind: Pod
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "test") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "test") | nindent 4 }}
  {{- $hookAnnotations := dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
  {{- include "raggo.annotationsBlock" (dict "ctx" $ "annotations" $hookAnnotations) | nindent 2 }}
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "raggo.serviceAccountName" . }}
  automountServiceAccountToken: false
  {{- include "raggo.imagePullSecrets" . | nindent 2 }}
  securityContext:
    {{- include "raggo.podSecurityContext" . | nindent 4 }}
  containers:
    - name: test-connection
      image: {{ include "raggo.image" (dict "ctx" $ "image" .Values.backend.image) }}
      imagePullPolicy: {{ include "raggo.imagePullPolicy" (dict "ctx" $ "image" .Values.backend.image) }}
      securityContext:
        {{- include "raggo.containerSecurityContext" . | nindent 8 }}
      # Validate the install end-to-end:
      #   1. backend `/health` is reachable from inside the cluster
      #   2. backend `/domain` returns the configured domain
      #   3. database connectivity probe via `app.cli check`
      command:
        - sh
        - -c
        - |
          set -eu
          BACKEND="http://{{ include "raggo.componentName" (dict "ctx" $ "component" "backend") }}:{{ .Values.backend.service.port }}"
          echo "Probing $BACKEND/health"
          python - <<'PY'
          import json, sys, urllib.request, os
          backend = os.environ["BACKEND"]
          with urllib.request.urlopen(f"{backend}/health", timeout=10) as r:
              body = json.load(r)
          assert body.get("status") == "ok", body
          print("health ok")
          with urllib.request.urlopen(f"{backend}/domain", timeout=10) as r:
              dom = json.load(r)
          assert dom.get("name") == os.environ["RAGGO_DOMAIN"], dom
          print("domain ok:", dom.get("name"))
          PY
          echo "Probing database connectivity"
          python -m app.cli check
      env:
        - name: BACKEND
          value: "http://{{ include "raggo.componentName" (dict "ctx" $ "component" "backend") }}:{{ .Values.backend.service.port }}"
        {{- include "raggo.databaseEnv" . | nindent 8 }}
      envFrom:
        - configMapRef:
            name: {{ include "raggo.componentName" (dict "ctx" $ "component" "config") }}
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
