{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raggo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of the chart's pods need to talk to the Kubernetes API, so we
# never automount the SA token. Pods opt back in individually if a
# future feature ever requires it.
automountServiceAccountToken: false
{{- end }}
