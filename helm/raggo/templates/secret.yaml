{{- if .Values.secret.create -}}
{{- /*
   Generate a strong random password when the operator left
   `secret.values.postgresPassword` empty. Helm preserves the value
   across upgrades because we look up the existing Secret first.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "raggo.secretName" .) -}}
{{- $explicit := default "" .Values.secret.values.postgresPassword -}}
{{- $password := "" -}}
{{- if $explicit -}}
  {{- $password = $explicit -}}
{{- else if and $existing $existing.data (index $existing.data "postgresPassword") -}}
  {{- $password = (index $existing.data "postgresPassword" | b64dec) -}}
{{- else -}}
  {{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "raggo.secretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.labels" . | nindent 4 }}
  {{- include "raggo.annotationsBlock" $ | nindent 2 }}
type: Opaque
data:
  postgresPassword: {{ $password | b64enc | quote }}
{{- end -}}
