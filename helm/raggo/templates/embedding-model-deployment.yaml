apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "embedding-model") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "embedding-model") | nindent 4 }}
spec:
  replicas: {{ .Values.embeddingModel.replicas }}
  selector:
    matchLabels:
      {{- include "raggo.selectorLabels" (dict "ctx" $ "component" "embedding-model") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raggo.componentLabels" (dict "ctx" $ "component" "embedding-model") | nindent 8 }}
        {{- with .Values.embeddingModel.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.embeddingModel.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "raggo.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "raggo.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "raggo.podSecurityContext" . | nindent 8 }}
      {{- with .Values.embeddingModel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingModel.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddingModel.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: embedding-model
          image: {{ include "raggo.image" (dict "ctx" $ "image" .Values.embeddingModel.image) }}
          imagePullPolicy: {{ include "raggo.imagePullPolicy" (dict "ctx" $ "image" .Values.embeddingModel.image) }}
          securityContext:
            {{- include "raggo.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "raggo.componentName" (dict "ctx" $ "component" "config") }}
          env:
            - name: EMBEDDING_MODEL_DIR
              value: /models/embedding
          startupProbe:
            {{- toYaml .Values.embeddingModel.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.embeddingModel.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.embeddingModel.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.embeddingModel.resources | nindent 12 }}
          volumeMounts:
            # `readOnlyRootFilesystem: true` is enforced. Provide a
            # tmpfs-backed scratch dir for HF caches and any transient
            # writes the embedding service may need.
            - name: tmp
              mountPath: /tmp
            - name: hf-cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
