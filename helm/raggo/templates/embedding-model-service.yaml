apiVersion: v1
kind: Service
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "embedding-model") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "embedding-model") | nindent 4 }}
spec:
  type: {{ .Values.embeddingModel.service.type }}
  ports:
    - name: http
      port: {{ .Values.embeddingModel.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raggo.selectorLabels" (dict "ctx" $ "component" "embedding-model") | nindent 4 }}
