apiVersion: v1
kind: Service
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "backend") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
  {{- include "raggo.annotationsBlock" $ | nindent 2 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "raggo.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
