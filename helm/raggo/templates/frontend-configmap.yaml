apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "frontend-nginx") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
data:
  # Frontend nginx config rewritten so `proxy_pass` targets the backend
  # ClusterIP service rather than the Compose service hostname
  # (`backend`). Otherwise identical to `frontend/nginx.conf` in the
  # repo, including the `/api/` rewrite that strips the prefix before
  # forwarding to the backend.
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass         http://{{ include "raggo.componentName" (dict "ctx" $ "component" "backend") }}:{{ .Values.backend.service.port }}/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
