{{- if .Values.migrate.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "raggo.componentName" (dict "ctx" $ "component" "migrate") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "raggo.componentLabels" (dict "ctx" $ "component" "migrate") | nindent 4 }}
  annotations:
    # Run before the workloads come up on both fresh installs and
    # upgrades so the schema (pgvector + active domain pack) is always
    # in place before the backend Deployment rolls.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "raggo.componentLabels" (dict "ctx" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "raggo.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "raggo.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "raggo.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "raggo.image" (dict "ctx" $ "image" .Values.backend.image) }}
          imagePullPolicy: {{ include "raggo.imagePullPolicy" (dict "ctx" $ "image" .Values.backend.image) }}
          securityContext:
            {{- include "raggo.containerSecurityContext" . | nindent 12 }}
          # The backend image ships `app/cli.py`, which exposes a
          # `migrate` subcommand. It waits for Postgres, ensures the
          # `vector` extension exists, and applies the active domain
          # pack's `init.sql` if its first table is missing. The
          # operation is idempotent on subsequent upgrades.
          command:
            - python
            - -m
            - app.cli
            - migrate
          envFrom:
            - configMapRef:
                name: {{ include "raggo.componentName" (dict "ctx" $ "component" "config") }}
          env:
            {{- include "raggo.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end -}}
