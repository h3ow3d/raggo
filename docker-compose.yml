# rag-flight-lab — Docker Compose (Phase 1 + Phase 2 + Phase 3)
#
# Brings up PostgreSQL (with pgvector), the FastAPI backend, the
# embedding model service, and the generation model service. Frontend
# arrives in a later phase.
#
# Security notes:
#   - postgres has NO host port mapping and is attached only to the
#     internal `database_net` network.
#   - embedding-model and generation-model have NO host port mapping and
#     are attached only to the internal `model_net` network. They cannot
#     be reached from the host or from the frontend.
#   - `database_net` and `model_net` are declared as `internal: true`.
#     Services attached only to those internal networks (such as
#     postgres, embedding-model, and generation-model) are isolated from
#     the host network/internet. The backend intentionally bridges
#     `frontend_net` with those internal networks, so it can still reach
#     the host/internet via `frontend_net`.
#   - The backend exposes port 8000 to the host for development only.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_flight_lab}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - database_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_flight_lab}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAGGO_DOMAIN: ${RAGGO_DOMAIN:-flights}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag_flight_lab}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      SEED_FLIGHT_COUNT: ${SEED_FLIGHT_COUNT:-5000}
      SEED_LOG_COUNT: ${SEED_LOG_COUNT:-50000}
      SEED_INCIDENT_COUNT: ${SEED_INCIDENT_COUNT:-500}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-model:8000}
      EMBEDDING_REQUEST_TIMEOUT: ${EMBEDDING_REQUEST_TIMEOUT:-60}
      GENERATION_SERVICE_URL: ${GENERATION_SERVICE_URL:-http://generation-model:8000}
      GENERATION_REQUEST_TIMEOUT: ${GENERATION_REQUEST_TIMEOUT:-180}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-128}
      STARTUP_INGEST_LIMIT: ${STARTUP_INGEST_LIMIT:-2000}
    ports:
      # Development-only API port. Safe to remove for non-dev deployments.
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      # Backend bridges the host-facing frontend network and the internal
      # database/model networks. The backend is the only service permitted
      # to reach the embedding-model on `model_net`.
      - frontend_net
      - database_net
      - model_net

  frontend:
    # React + Vite SPA. The image is built in two stages: a node builder
    # produces the static assets, and an nginx runtime serves them while
    # proxying `/api/*` to the backend over `frontend_net`. The frontend
    # is intentionally NOT attached to `database_net` or `model_net`, so
    # it cannot reach PostgreSQL, the embedding model, or the generation
    # model directly.
    build:
      context: ./frontend
    image: rag-flight-lab/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - frontend_net

  embedding-model:
    # Build the multi-stage image: the `weights` stage downloads the
    # configured sentence-transformers model at build time and the runtime
    # stage copies it in. The runtime container does not have outbound
    # network access (it is only on the internal `model_net`) and runs
    # with HF_HUB_OFFLINE=1 / TRANSFORMERS_OFFLINE=1.
    build:
      context: ./models/embedding
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
        EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    image: rag-flight-lab/embedding-model:latest
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_MODEL_DIR: /models/embedding
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    # Internal-only: no `ports:` mapping. The service is reachable from
    # the backend at http://embedding-model:8000 over `model_net`.
    networks:
      - model_net
    # Container hardening. The image is fully self-contained (weights baked
    # in), so the filesystem can be read-only with a small tmpfs for any
    # transient scratch needs.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  generation-model:
    # Build the multi-stage image: the `weights` stage downloads the
    # configured Hugging Face generation model at build time and the
    # runtime stage copies it in. The runtime container does not have
    # outbound network access (it is only on the internal `model_net`)
    # and runs with HF_HUB_OFFLINE=1 / TRANSFORMERS_OFFLINE=1.
    build:
      context: ./models/generation
      args:
        GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
        MODEL_RUNTIME: ${MODEL_RUNTIME:-cpu}
    image: rag-flight-lab/generation-model:latest
    restart: unless-stopped
    environment:
      GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      GENERATION_MODEL_DIR: /models/generation
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    # Internal-only: no `ports:` mapping. The service is reachable from
    # the backend at http://generation-model:8000 over `model_net`.
    networks:
      - model_net
    # Container hardening. The image is fully self-contained (weights
    # baked in), so the filesystem can be read-only with a small tmpfs
    # for any transient scratch needs (HF caches, tokenizer scratch).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
  database_net:
    driver: bridge
    internal: true
  model_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
