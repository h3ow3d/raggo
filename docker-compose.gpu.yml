# rag-flight-lab — GPU override (Phase 3)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# This override requests NVIDIA GPU resources for the generation-model
# service only. The embedding-model stays CPU-first. The default
# `docker-compose.yml` must remain CPU-only; running it without this
# override should never require a GPU.
#
# Notes:
#   - GPU support applies only to the generation model service.
#   - The internal `model_net` network and all container hardening from
#     the base compose file still apply. No host ports are exposed.
#   - This override sets `MODEL_RUNTIME=gpu` as a build arg so the
#     runtime image installs a CUDA-enabled torch wheel; the resulting
#     image is distinct from the default CPU image. Re-run with
#     `--build` after switching modes.

services:
  generation-model:
    build:
      args:
        # Switches the runtime stage to install a CUDA-enabled torch
        # wheel (see models/generation/Dockerfile).
        MODEL_RUNTIME: gpu
    environment:
      MODEL_RUNTIME: gpu
      # Allow CUDA-using libraries to discover the GPU at runtime. With
      # `cap_drop: [ALL]` and `no-new-privileges:true` from the base file
      # still in effect, this only enables device access via the NVIDIA
      # runtime — it does not grant additional kernel capabilities.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
