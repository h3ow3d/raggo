# rag-flight-lab — GPU override (placeholder for Phase 1)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# This file is intentionally a placeholder during Phase 1: the embedding
# and generation model services are introduced in later phases. When those
# services exist, this override will request NVIDIA GPU resources for the
# generation model only (the embedding model stays CPU-first).
#
# Documented structure for the future generation-model service:
#
#   services:
#     generation-model:
#       environment:
#         MODEL_RUNTIME: gpu
#       deploy:
#         resources:
#           reservations:
#             devices:
#               - driver: nvidia
#                 count: 1
#                 capabilities: [gpu]
#
# Notes:
#   - Default `docker-compose.yml` must remain CPU-only.
#   - GPU support applies only to the generation model service.
#   - Do not expose model services to the host even in GPU mode; the
#     internal `model_net` network and security hardening still apply.

services: {}
