# nginx config for the rag-flight-lab frontend container.
#
# The frontend is a Vite-built React SPA. Nginx:
#   - serves the built static assets,
#   - proxies `/api/*` to the backend on the shared `frontend_net` Docker
#     network (the backend is the only service the frontend may reach),
#   - never proxies to embedding-model or generation-model. Those services
#     live on the internal `model_net` and are not reachable from this
#     container.

server {
    listen 80 default_server;
    server_name _;

    # Static SPA files
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes (e.g. /search, /chat) work on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy. The trailing slashes strip the `/api` prefix before
    # forwarding to the backend, so the backend keeps its existing routes
    # (`/health`, `/stats`, `/logs`, `/search/vector`, `/query`, …).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Agent queries can take a while because the backend invokes the
        # local generation model. Give them room.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
