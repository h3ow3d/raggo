# Reusable workflow: build, push, sign, SBOM, and provenance for the
# raggo image set.
#
# This workflow is the **single source of truth** for image builds. It
# is invoked by:
#
#   - `pr-images.yml`          (PR previews, amd64-only, unsigned)
#   - `release.yml`            (introduced in Phase 6, tag-triggered,
#                               signed multi-arch with SBOM/provenance)
#   - manual `workflow_dispatch` against the default branch (Phase 1
#     exit criterion: produces signed multi-arch images on demand).
#
# Inputs let callers control the tag set (semver / sha / pr), the
# architecture matrix, and whether to sign and attest. Application
# images and the postgres-pgvector image build for amd64+arm64 by
# default. Model images default to amd64 only and arm64 best-effort
# (see `model_archs`).
#
# Tagging scheme (see PHASE_1_GHCR_IMAGES.md and docs/images.md):
#
#   - vMAJOR.MINOR.PATCH        — semver release tags
#   - sha-<short>               — every default-branch build
#   - pr-<num>-sha-<short>      — PR previews
#   - latest                    — only on default-branch builds
#   - <name>-r<rev>             — additional suffix on model images,
#                                 derived from EMBEDDING_MODEL_NAME /
#                                 GENERATION_MODEL_NAME + revision.
#
# All images are pushed to ghcr.io/h3ow3d/raggo/<service>.

name: build-images

on:
  workflow_call:
    inputs:
      semver:
        description: "Semver tag including the leading 'v' (e.g. v0.1.0). Empty disables semver tagging."
        required: false
        type: string
        default: ""
      pr_number:
        description: "Pull request number for pr-<num>-sha-<short> tagging. Empty disables PR tagging."
        required: false
        type: string
        default: ""
      push_latest:
        description: "Tag images :latest (default-branch builds only)."
        required: false
        type: boolean
        default: false
      app_archs:
        description: "Comma-separated platforms for backend/frontend/postgres-pgvector."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      model_archs:
        description: "Comma-separated platforms for embedding/generation model images."
        required: false
        type: string
        default: "linux/amd64"
      sign:
        description: "Sign images with cosign and attach SBOM + SLSA provenance attestations."
        required: false
        type: boolean
        default: false
      embedding_model_name:
        description: "Build arg for the embedding model image."
        required: false
        type: string
        default: "sentence-transformers/all-MiniLM-L6-v2"
      embedding_dim:
        description: "Build arg for the embedding model image."
        required: false
        type: string
        default: "384"
      embedding_revision:
        description: "Revision suffix used in the model image tag (e.g. r1)."
        required: false
        type: string
        default: "r1"
      generation_model_name:
        description: "Build arg for the generation model image."
        required: false
        type: string
        default: "Qwen/Qwen2.5-0.5B-Instruct"
      generation_revision:
        description: "Revision suffix used in the model image tag (e.g. r1)."
        required: false
        type: string
        default: "r1"
    secrets:
      cosign_private_key:
        description: "PEM-encoded cosign private key. Required when sign=true."
        required: false
      cosign_password:
        description: "Passphrase for the cosign private key. Required when sign=true."
        required: false

  # Manual entrypoint used to satisfy the Phase 1 exit criterion:
  # `workflow_dispatch` with sign=true on the default branch publishes
  # signed multi-arch images with SBOMs and provenance.
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver tag including the leading 'v' (e.g. v0.1.0). Empty disables semver tagging."
        required: false
        type: string
        default: ""
      push_latest:
        description: "Tag images :latest (only meaningful on the default branch)."
        required: false
        type: boolean
        default: false
      app_archs:
        description: "Comma-separated platforms for backend/frontend/postgres-pgvector."
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      model_archs:
        description: "Comma-separated platforms for embedding/generation model images."
        required: false
        type: string
        default: "linux/amd64"
      sign:
        description: "Sign images with cosign and attach SBOM + SLSA provenance."
        required: false
        type: boolean
        default: true
      embedding_model_name:
        description: "Build arg for the embedding model image."
        required: false
        type: string
        default: "sentence-transformers/all-MiniLM-L6-v2"
      embedding_dim:
        description: "Build arg for the embedding model image."
        required: false
        type: string
        default: "384"
      embedding_revision:
        description: "Revision suffix used in the model image tag (e.g. r1)."
        required: false
        type: string
        default: "r1"
      generation_model_name:
        description: "Build arg for the generation model image."
        required: false
        type: string
        default: "Qwen/Qwen2.5-0.5B-Instruct"
      generation_revision:
        description: "Revision suffix used in the model image tag (e.g. r1)."
        required: false
        type: string
        default: "r1"

permissions:
  contents: read
  packages: write
  id-token: write           # for SLSA provenance OIDC token
  attestations: write       # for `actions/attest-*`

env:
  REGISTRY: ghcr.io
  OWNER: h3ow3d
  PROJECT: raggo

jobs:
  # ---------------------------------------------------------------------------
  # Resolve common values once so every matrix job sees the same tag set.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      pr_tag: ${{ steps.meta.outputs.pr_tag }}
      semver_tag: ${{ steps.meta.outputs.semver_tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      sign: ${{ steps.meta.outputs.sign }}
      embedding_tag_suffix: ${{ steps.meta.outputs.embedding_tag_suffix }}
      generation_tag_suffix: ${{ steps.meta.outputs.generation_tag_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag set
        id: meta
        shell: bash
        env:
          IN_SEMVER: ${{ inputs.semver }}
          IN_PR_NUMBER: ${{ inputs.pr_number }}
          IN_PUSH_LATEST: ${{ inputs.push_latest }}
          IN_SIGN: ${{ inputs.sign }}
          IN_EMBED_NAME: ${{ inputs.embedding_model_name }}
          IN_EMBED_REV: ${{ inputs.embedding_revision }}
          IN_GEN_NAME: ${{ inputs.generation_model_name }}
          IN_GEN_REV: ${{ inputs.generation_revision }}
        run: |
          set -euo pipefail
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

          if [[ -n "${IN_PR_NUMBER}" ]]; then
            echo "pr_tag=pr-${IN_PR_NUMBER}-sha-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_tag=" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${IN_SEMVER}" ]]; then
            if [[ ! "${IN_SEMVER}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::semver input '${IN_SEMVER}' does not match vMAJOR.MINOR.PATCH"
              exit 1
            fi
            echo "semver_tag=${IN_SEMVER}" >> "$GITHUB_OUTPUT"
          else
            echo "semver_tag=" >> "$GITHUB_OUTPUT"
          fi

          echo "push_latest=${IN_PUSH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "sign=${IN_SIGN}" >> "$GITHUB_OUTPUT"

          # Model image revision suffixes: take the last path segment of
          # the model name, strip non-alphanumerics, lowercase, and
          # append the revision. e.g. sentence-transformers/all-MiniLM-L6-v2
          # + r1 -> all-minilm-l6-v2-r1.
          slug() {
            echo "$1" | awk -F/ '{print tolower($NF)}' \
              | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-|-$//g'
          }
          embed_slug="$(slug "${IN_EMBED_NAME}")"
          gen_slug="$(slug "${IN_GEN_NAME}")"
          echo "embedding_tag_suffix=${embed_slug}-${IN_EMBED_REV}" >> "$GITHUB_OUTPUT"
          echo "generation_tag_suffix=${gen_slug}-${IN_GEN_REV}" >> "$GITHUB_OUTPUT"

      - name: Validate signing inputs
        if: ${{ inputs.sign == true }}
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key || secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.cosign_password || secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${COSIGN_PRIVATE_KEY:-}" || -z "${COSIGN_PASSWORD:-}" ]]; then
            echo "::error::sign=true requires COSIGN_PRIVATE_KEY and COSIGN_PASSWORD secrets"
            exit 1
          fi
          if grep -q "PLACEHOLDER_REPLACE_WITH_REAL_COSIGN_PUBLIC_KEY" .github/cosign.pub 2>/dev/null; then
            echo "::error::.github/cosign.pub is still the placeholder; replace it before publishing signed images"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build, push, sign and attest each image. The matrix is intentionally
  # explicit so each image can carry its own context, archs, build args,
  # and additional model-revision tag suffix.
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            archs_input: app
            extra_suffix: ""
            build_args: ""
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            archs_input: app
            extra_suffix: ""
            build_args: ""
          - name: postgres-pgvector
            context: ./db
            dockerfile: ./db/Dockerfile
            archs_input: app
            extra_suffix: ""
            build_args: ""
          - name: embedding-model
            context: ./models/embedding
            dockerfile: ./models/embedding/Dockerfile
            archs_input: model
            extra_suffix: embedding
            build_args: |
              EMBEDDING_MODEL_NAME=${{ inputs.embedding_model_name }}
              EMBEDDING_DIM=${{ inputs.embedding_dim }}
          - name: generation-model
            context: ./models/generation
            dockerfile: ./models/generation/Dockerfile
            archs_input: model
            extra_suffix: generation
            build_args: |
              GENERATION_MODEL_NAME=${{ inputs.generation_model_name }}
              MODEL_RUNTIME=cpu

    env:
      IMAGE: ghcr.io/h3ow3d/raggo/${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve archs for this image
        id: archs
        shell: bash
        run: |
          if [[ "${{ matrix.archs_input }}" == "app" ]]; then
            echo "platforms=${{ inputs.app_archs }}" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=${{ inputs.model_archs }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tag list
        id: tags
        shell: bash
        env:
          SHA_TAG: ${{ needs.prepare.outputs.sha_tag }}
          PR_TAG: ${{ needs.prepare.outputs.pr_tag }}
          SEMVER_TAG: ${{ needs.prepare.outputs.semver_tag }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
          EXTRA_SUFFIX: ${{ matrix.extra_suffix }}
          EMBED_SUFFIX: ${{ needs.prepare.outputs.embedding_tag_suffix }}
          GEN_SUFFIX: ${{ needs.prepare.outputs.generation_tag_suffix }}
        run: |
          set -euo pipefail
          tags=()
          # Always include the commit SHA tag.
          tags+=("${IMAGE}:${SHA_TAG}")
          # PR preview tag (only when pr_number was provided).
          if [[ -n "${PR_TAG}" ]]; then
            tags+=("${IMAGE}:${PR_TAG}")
          fi
          # Semver tag (release builds).
          if [[ -n "${SEMVER_TAG}" ]]; then
            tags+=("${IMAGE}:${SEMVER_TAG}")
          fi
          # `latest` only when caller asked for it AND we are not building
          # a PR preview (PRs never push :latest).
          if [[ "${PUSH_LATEST}" == "true" && -z "${PR_TAG}" ]]; then
            tags+=("${IMAGE}:latest")
          fi

          # Model images carry an additional revision-suffixed tag so a
          # given model+revision is always pullable by a stable name even
          # when the underlying source code rev changes.
          case "${EXTRA_SUFFIX}" in
            embedding)
              tags+=("${IMAGE}:${EMBED_SUFFIX}")
              if [[ -n "${SEMVER_TAG}" ]]; then
                tags+=("${IMAGE}:${SEMVER_TAG}-${EMBED_SUFFIX}")
              fi
              ;;
            generation)
              tags+=("${IMAGE}:${GEN_SUFFIX}")
              if [[ -n "${SEMVER_TAG}" ]]; then
                tags+=("${IMAGE}:${SEMVER_TAG}-${GEN_SUFFIX}")
              fi
              ;;
          esac

          # Emit as newline-separated list for docker/build-push-action.
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.archs.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          # buildkit-attached attestations (provenance + SBOM) are only
          # generated on signed builds. PR previews stay clean.
          provenance: ${{ inputs.sign }}
          sbom: ${{ inputs.sign }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=raggo ${{ matrix.name }} image

      - name: Output image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${IMAGE}@${DIGEST}"
          echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"

      # ----- Signing / SBOM / provenance (release path only) -----------------

      - name: Install cosign
        if: ${{ inputs.sign == true }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (key)
        if: ${{ inputs.sign == true }}
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key || secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.cosign_password || secrets.COSIGN_PASSWORD }}
          IMG: ${{ env.image_ref }}
        run: |
          set -euo pipefail
          # Sign by digest so we sign the actual artifact, not a tag.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMG}"

      - name: Generate SBOM (SPDX JSON via syft)
        if: ${{ inputs.sign == true }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.image_ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false

      - name: Attach SBOM as OCI attestation
        if: ${{ inputs.sign == true }}
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/h3ow3d/raggo/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Generate SLSA build provenance attestation
        if: ${{ inputs.sign == true }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/h3ow3d/raggo/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Mark each package public after the first push. Creating a package
  # under a user/org via GHCR initially makes it private; we explicitly
  # flip visibility to `public` so installs do not need a pull secret.
  # No-op once the package is already public.
  # ---------------------------------------------------------------------------
  mark-public:
    needs: build
    runs-on: ubuntu-latest
    # Always run, including on PR builds: a fresh registry creates
    # private packages on first push, and PR previews must be pullable
    # by reviewers without auth. Fork PRs are blocked at the
    # `pr-images.yml` level, so this only runs for trusted refs.
    strategy:
      matrix:
        package:
          - backend
          - frontend
          - postgres-pgvector
          - embedding-model
          - generation-model
    steps:
      - name: Set package visibility to public
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pkg = '${{ matrix.package }}';
            const owner = '${{ env.OWNER }}';
            const project = '${{ env.PROJECT }}';
            const fullName = `${project}/${pkg}`;
            try {
              await github.request(
                'PATCH /users/{username}/packages/container/{package_name}/visibility',
                {
                  username: owner,
                  package_name: encodeURIComponent(fullName),
                  visibility: 'public',
                },
              );
              core.info(`Set ${fullName} to public`);
            } catch (err) {
              // The package may not exist yet on the very first run, or
              // the endpoint may return 422 if it is already public.
              // Both are non-fatal; surface the error but do not fail.
              core.warning(
                `Could not set visibility for ${fullName}: ${err.status} ${err.message}`,
              );
            }
